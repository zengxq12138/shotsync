name = "shotsync"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Archive-pool settings (R2_S3_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY)
# and AUTH_TOKEN are secrets applied from .env by `npm run setup` — see
# scripts/setup.sh. Do not hardcode them here.

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "shotsync"

# Inject AUTH_TOKEN via: wrangler secret put AUTH_TOKEN — do not hardcode here

# Public read-only demo pool: deploy with `wrangler deploy --env demo`.
# Needs its own bucket + token: see scripts/deploy-demo.sh.
[env.demo]
name = "shotsync-demo"

[env.demo.vars]
DEMO_MODE = "1"
R2_S3_ENDPOINT = "https://a88c2595dbb442f8d5dd427782709ce2.r2.cloudflarestorage.com"



[[env.demo.r2_buckets]]
binding = "BUCKET"
bucket_name = "shotsync-demo"
